---
- name: Install Docker engine and verify with hello-world
  hosts: all
  become: true
  gather_facts: true
  vars:
    docker_user: "{{ lookup('env', 'DOCKER_USER')  }}"

  tasks:
    - name: Get docker user UID
      ansible.builtin.command: id -u {{ docker_user }}
      register: docker_uid
      changed_when: false

    - name: Add +x permissions
      copy:
        remote_src: yes
        src: "/home/app/a/starterkit.laravel-react-docker/website/{{ item }}"
        dest: "/home/app/a/starterkit.laravel-react-docker/website/{{ item }}"
        mode: a+x
      loop:
        - run_env.sh
        - stop_env.sh
      become_user: "{{ docker_user  }}"

    - name: Verify Docker daemon is running rootless
      shell:
        chdir: /home/app/a/starterkit.laravel-react-docker/website
        cmd: ./run_env.sh production
      become_user: "{{ docker_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ docker_uid.stdout }}"
        DOCKER_HOST: "unix:///run/user/{{ docker_uid.stdout }}/docker.sock"
      changed_when: false
