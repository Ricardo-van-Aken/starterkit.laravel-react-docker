name: Prebuild devcontainers

on:
  push:
    branches:
      - main
    paths:
      - '**/.devcontainer/**'
      - .github/workflows/prebuild-devcontainer.yml
  workflow_dispatch:

jobs:
  discover:
    name: Discover devcontainers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Find Dockerfile-based devcontainers
        id: find
        shell: bash
        run: |
          set -euo pipefail

          # Every Dockerfile-based devcontainer (compose-based ones are built by their own pipeline).
          mapfile -t entries < <(
            find . -path '*/.devcontainer/devcontainer.json' \
              -not -path '*/node_modules/*' -not -path '*/vendor/*' \
            | while read -r f; do
                if grep -q '"dockerfile"' "$f" && ! grep -q 'dockerComposeFile' "$f"; then
                  dir="$(dirname "$(dirname "$f")")"
                  if [ "$dir" = "." ]; then name="root"; sub="."; else name="$(basename "$dir")"; sub="${dir#./}"; fi
                  echo "{\"subFolder\":\"$sub\",\"tag\":\"devcontainer-$name\"}"
                fi
              done
          )

          if [ ${#entries[@]} -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            printf -v joined '%s,' "${entries[@]}"
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[${joined%,}]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.tag }}
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate Docker Tags
        id: vars
        uses: ./.github/actions/docker-tag
        with:
          branch_name: ${{ github.head_ref || github.ref_name }}
          docker_username: ${{ vars.DOCKER_HUB_USERNAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push ${{ matrix.tag }}
        uses: devcontainers/ci@v0.3
        with:
          subFolder: ${{ matrix.subFolder }}
          imageName: ${{ steps.vars.outputs.image_repo }}:${{ matrix.tag }}
          cacheFrom: ${{ steps.vars.outputs.image_repo }}:${{ matrix.tag }}
          push: always
