name: Push changes

on:
  push:
    branches:
      - staging
      - dev
      - production

  workflow_dispatch:
    inputs:
      environment:
        description: 'Push changes'
        required: true
        type: choice
        options:
          - staging
          - dev
          - production

env:
  # DigitalOcean Spaces bucket name and access key, used for terraform remote state.
  TF_VAR_region: ${{ vars.DO_STATE_BUCKET_REGION }}
  TF_VAR_bucket_name: ${{ vars.DO_STATE_BUCKET_NAME }}  
  AWS_ACCESS_KEY_ID: ${{ vars.DO_STATE_BUCKET_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_STATE_BUCKET_SECRET_KEY }}

  # Terraforms DigitalOcean provider authorization.
  TF_VAR_do_token: ${{ secrets.DO_TOKEN }}

  # Terraform [TODO: description]
  TF_VAR_ssh_key_name: ${{ secrets.SSH_KEY_NAME }} # Environment key gebruiken

  DOCKER_USER: ${{ vars.DOCKER_USER }}

  WORKSPACE: ${{ github.workspace }}

  ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment || github.ref_name) || github.ref_name }}

  IMAGE_NAME: ${{ vars.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  build-common-images:
    name: Build docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: website-nginx
            context: website/docker/img_nginx
            file: website/docker/img_nginx/Dockerfile.nginx
            
          - name: website-redis
            context: website/docker/img_redis
            file: website/docker/img_redis/Dockerfile.redis
            
          - name: website-certbot
            context: website/docker/img_certbot
            file: website/docker/img_certbot/Dockerfile.certbot
            
          - name: laravel-base
            context: website
            file: website/docker/img_laravel/Dockerfile.laravel-base
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.image.context }}
          push: true
          file: ${{ matrix.image.file }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.image.name }}.${{ env.ENVIRONMENT }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:${{ matrix.image.name }}.${{ env.ENVIRONMENT }}.cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:${{ matrix.image.name }}.${{ env.ENVIRONMENT }}.cache,mode=max

  build-app-image:
    name: Build the laravel app
    runs-on: ubuntu-latest
    needs: build-common-images
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v4
        with:
          context: website/
          push: true
          file: website/docker/img_laravel/Dockerfile.laravel-volume
          tags: |
            ${{ env.IMAGE_NAME }}:laravel-app.${{ env.ENVIRONMENT }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_NAME }}:laravel-base.${{ env.ENVIRONMENT }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:laravel-app.${{ env.ENVIRONMENT }}.cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:laravel-app.${{ env.ENVIRONMENT }}.cache,mode=max

  deploy-builds:
    runs-on: ubuntu-latest
    needs: build-app-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/terraform/utils/generate-backend
        with:
          state_bucket_region: ${{ vars.DO_STATE_BUCKET_REGION }}
          state_bucket_name: ${{ vars.DO_STATE_BUCKET_NAME }}

      - uses: ./.github/actions/terraform/utils/state
        id: outputs
        with:
          output_keys: "droplet_ipv4"
          working_dir: deployment/terraform/environments/common
          workspace_key_prefix: "projects/${{ github.event.repository.name }}/infra-environments"
          environment: $ENVIRONMENT

      - uses: ./.github/actions/ansible/deploy-builds
        env:
          DROPLET_IP: ${{ fromJSON(steps.outputs.outputs.json).droplet_ipv4 }}
          ANSIBLE_HOST_KEY_CHECKING: "True"
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
        with:
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}