name: Push changes

on:
  push:
    branches:
      - dev
      - staging
      - production

  workflow_dispatch:
    inputs:
      environment:
        description: 'Push changes'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || github.ref_name }}

jobs:
  build-images:
    name: Build and Push All Images
    runs-on: ubuntu-latest
    steps:
      - name: Resolve App Image Build Target
        id: build_target
        run: |
          case "${{ env.ENVIRONMENT }}" in
            "production") echo "target=production" >> $GITHUB_OUTPUT ;;
            "staging")    echo "target=production" >> $GITHUB_OUTPUT ;;
            "dev")        echo "target=dev" >> $GITHUB_OUTPUT ;;
            *)            echo "::error::Invalid environment: ${{ env.ENVIRONMENT }}. Allowed: dev, staging, production."; exit 1 ;;
          esac

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate Docker Tags
        id: vars
        uses: ./.github/actions/docker-tag
        with:
          branch_name: ${{ env.ENVIRONMENT }}
          docker_username: ${{ vars.DOCKER_HUB_USERNAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Load environment variables for Docker Compose
        run: |
          grep -v '^#' website/docker/.env.${{ env.ENVIRONMENT }} | grep -v '^[[:space:]]*$' >> $GITHUB_ENV

      - name: Build and Push with Docker Bake
        uses: docker/bake-action@v7
        with:
          push: true
          source: ./website
          files: |
            compose.yaml
            ${{ env.ENVIRONMENT == 'dev' && 'compose.dev.yaml' || '' }}
          targets: |
            app
            scheduler
            nginx
            redis
            certbot
          set: |
            app.cache-from=type=registry,ref=${{ steps.vars.outputs.image_repo }}:laravel-app.${{ steps.vars.outputs.safe_tag }}.deploy-cache
            app.cache-from=type=registry,ref=${{ steps.vars.outputs.image_repo }}:laravel-app.main.cache
            app.cache-to=type=registry,ref=${{ steps.vars.outputs.image_repo }}:laravel-app.${{ steps.vars.outputs.safe_tag }}.deploy-cache,mode=max

            scheduler.cache-from=type=registry,ref=${{ steps.vars.outputs.image_repo }}:laravel-scheduler.${{ steps.vars.outputs.safe_tag }}.deploy-cache
            scheduler.cache-from=type=registry,ref=${{ steps.vars.outputs.image_repo }}:laravel-scheduler.main.cache
            scheduler.cache-to=type=registry,ref=${{ steps.vars.outputs.image_repo }}:laravel-scheduler.${{ steps.vars.outputs.safe_tag }}.deploy-cache,mode=max

            nginx.cache-from=type=registry,ref=${{ steps.vars.outputs.image_repo }}:website-nginx.${{ steps.vars.outputs.safe_tag }}.deploy-cache
            nginx.cache-from=type=registry,ref=${{ steps.vars.outputs.image_repo }}:website-nginx.main.cache
            nginx.cache-to=type=registry,ref=${{ steps.vars.outputs.image_repo }}:website-nginx.${{ steps.vars.outputs.safe_tag }}.deploy-cache,mode=max

            redis.cache-from=type=registry,ref=${{ steps.vars.outputs.image_repo }}:website-redis.${{ steps.vars.outputs.safe_tag }}.deploy-cache
            redis.cache-from=type=registry,ref=${{ steps.vars.outputs.image_repo }}:website-redis.main.cache
            redis.cache-to=type=registry,ref=${{ steps.vars.outputs.image_repo }}:website-redis.${{ steps.vars.outputs.safe_tag }}.deploy-cache,mode=max

            certbot.cache-from=type=registry,ref=${{ steps.vars.outputs.image_repo }}:website-certbot.${{ steps.vars.outputs.safe_tag }}.deploy-cache
            certbot.cache-from=type=registry,ref=${{ steps.vars.outputs.image_repo }}:website-certbot.main.cache
            certbot.cache-to=type=registry,ref=${{ steps.vars.outputs.image_repo }}:website-certbot.${{ steps.vars.outputs.safe_tag }}.deploy-cache,mode=max

            app.tags=${{ steps.vars.outputs.image_repo }}:laravel-app.${{ steps.vars.outputs.safe_tag }}
            scheduler.tags=${{ steps.vars.outputs.image_repo }}:laravel-scheduler.${{ steps.vars.outputs.safe_tag }}
            nginx.tags=${{ steps.vars.outputs.image_repo }}:website-nginx.${{ steps.vars.outputs.safe_tag }}
            redis.tags=${{ steps.vars.outputs.image_repo }}:website-redis.${{ steps.vars.outputs.safe_tag }}
            certbot.tags=${{ steps.vars.outputs.image_repo }}:website-certbot.${{ steps.vars.outputs.safe_tag }}

            app.target=${{ steps.build_target.outputs.target }}
            scheduler.args.SCHEDULER_BASE=${{ steps.build_target.outputs.target }}

  deploy-builds:
    runs-on: ubuntu-latest
    needs: [build-images]
    env:
      DOCKER_USER: docker-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/terraform/utils/generate-backend
        with:
          state_bucket_region: ${{ vars.DO_STATE_BUCKET_REGION }}
          state_bucket_name: ${{ vars.DO_STATE_BUCKET_NAME }}

      - uses: ./.github/actions/terraform/utils/state
        id: outputs
        env:
          # DigitalOcean Spaces bucket name and access key, used for terraform remote state.
          AWS_ACCESS_KEY_ID: ${{ vars.DO_STATE_BUCKET_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_STATE_BUCKET_SECRET_KEY }}
        with:
          output_keys: "droplet_ipv4"
          working_dir: deployment/terraform/environments/common
          workspace_key_prefix: "projects/${{ github.event.repository.name }}/infra-environments"
          environment: ${{ env.ENVIRONMENT }} # Use current environment as workspace for terraform

      - uses: ./.github/actions/ansible/deploy-builds
        env:
          DROPLET_IP: ${{ fromJSON(steps.outputs.outputs.json).droplet_ipv4 }}
          ANSIBLE_HOST_KEY_CHECKING: "True"
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          WORKSPACE: ${{ github.workspace }} # Required in ansible step for finding files in repo
        with:
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}