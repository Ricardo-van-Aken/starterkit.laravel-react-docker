name: Push changes

on:
  push:
    branches:
      - staging
      - dev
      - production

  workflow_dispatch:
    inputs:
      environment:
        description: 'Push changes'
        required: true
        type: choice
        options:
          - staging
          - dev
          - production

env:
  ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment || github.ref_name) || github.ref_name }}
  TAG_ADDITION: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment || github.ref_name) || github.ref_name }}
  
  IMAGE_REPO: ${{ vars.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  build-laravel-image:
    name: Build app image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Laravel base image
        uses: docker/build-push-action@v5
        with:
          context: website
          file: website/docker/img_laravel/Dockerfile.laravel-base
          tags: |
            ${{ env.IMAGE_REPO }}:laravel-base.${{ env.TAG_ADDITION }}
          push: true
          load: true
          cache-from: |
            type=registry,ref=${{ env.IMAGE_REPO }}:laravel-base.${{ env.TAG_ADDITION }}.cache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:laravel-base.${{ env.TAG_ADDITION }}.cache,mode=max

      - name: Verify Laravel base image is available locally
        run: |
          if docker images --format "{{.Repository}}:{{.Tag}}" | grep -q "^${{ env.IMAGE_REPO }}:laravel-base.${{ env.TAG_ADDITION }}$"; then
            echo "Laravel base image is available locally"
            docker images | grep "laravel-base.${{ env.TAG_ADDITION }}"
          else
            echo "Laravel base image is NOT available locally"
            exit 1
          fi

      - name: Build Laravel app image
        uses: docker/build-push-action@v5
        with:
          context: website
          file: website/docker/img_laravel/Dockerfile.laravel-volume
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_REPO }}:laravel-base.${{ env.TAG_ADDITION }}
          tags: |
            ${{ env.IMAGE_REPO }}:laravel-app.${{ env.TAG_ADDITION }}
          push: true
          pull: false # Don't pull base image from Docker Hub (we just built it locally)
          load: true
          cache-from: |
            type=registry,ref=${{ env.IMAGE_REPO }}:laravel-app.${{ env.TAG_ADDITION }}.cache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:laravel-app.${{ env.TAG_ADDITION }}.cache,mode=max
    
  build-compose-images:
    name: Build docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: website-nginx
            context: website/docker/img_nginx
            file: website/docker/img_nginx/Dockerfile.nginx
            tag: website-nginx
          - name: website-redis
            context: website/docker/img_redis
            file: website/docker/img_redis/Dockerfile.redis
            tag: website-redis
          - name: website-certbot
            context: website/docker/img_certbot
            file: website/docker/img_certbot/Dockerfile.certbot
            tag: website-certbot
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.image.context }}
          push: true
          file: ${{ matrix.image.file }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ matrix.image.tag }}.${{ env.TAG_ADDITION }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:${{ matrix.image.tag }}.${{ env.TAG_ADDITION }}.cache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:${{ matrix.image.tag }}.${{ env.TAG_ADDITION }}.cache,mode=max

  deploy-builds:
    runs-on: ubuntu-latest
    needs: build-app-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/terraform/utils/generate-backend
        with:
          state_bucket_region: ${{ vars.DO_STATE_BUCKET_REGION }}
          state_bucket_name: ${{ vars.DO_STATE_BUCKET_NAME }}

      - uses: ./.github/actions/terraform/utils/state
        id: outputs
        env:
          # DigitalOcean Spaces bucket name and access key, used for terraform remote state.
          AWS_ACCESS_KEY_ID: ${{ vars.DO_STATE_BUCKET_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_STATE_BUCKET_SECRET_KEY }}
          # Terraforms DigitalOcean provider authorization.
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          # Terraform [TODO: description]
          TF_VAR_ssh_key_name: ${{ secrets.SSH_KEY_NAME }}
        with:
          output_keys: "droplet_ipv4"
          working_dir: deployment/terraform/environments/common
          workspace_key_prefix: "projects/${{ github.event.repository.name }}/infra-environments"
          environment: ${{ env.ENVIRONMENT }} # Use current environment as workspace for terraform

      - uses: ./.github/actions/ansible/deploy-builds
        env:
          DROPLET_IP: ${{ fromJSON(steps.outputs.outputs.json).droplet_ipv4 }}
          ANSIBLE_HOST_KEY_CHECKING: "True"
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
        with:
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}