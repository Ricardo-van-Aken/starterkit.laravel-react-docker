name: Run tests locally

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_REPO: ${{ vars.DOCKER_HUB_USERNAME }}/starterkit.laravel-react-docker
  TAG_ADDITION: test

jobs:
  build-laravel-image:
    name: Build app image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Laravel base image
        uses: docker/build-push-action@v5
        with:
          context: website
          file: website/docker/img_laravel/Dockerfile.laravel-base
          tags: |
            ${{ env.IMAGE_REPO }}:laravel-base.${{ env.TAG_ADDITION }}
          push: true
          load: true
          cache-from: |
            type=registry,ref=${{ env.IMAGE_REPO }}:laravel-base.${{ env.TAG_ADDITION }}.cache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:laravel-base.${{ env.TAG_ADDITION }}.cache,mode=max

      - name: Verify Laravel base image is available locally
        run: |
          if docker images --format "{{.Repository}}:{{.Tag}}" | grep -q "^${{ env.IMAGE_REPO }}:laravel-base.${{ env.TAG_ADDITION }}$"; then
            echo "Laravel base image is available locally"
            docker images | grep "laravel-base.${{ env.TAG_ADDITION }}"
          else
            echo "Laravel base image is NOT available locally"
            exit 1
          fi

      - name: Build Laravel app image
        uses: docker/build-push-action@v5
        with:
          context: website
          file: website/docker/img_laravel/Dockerfile.laravel-volume
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_REPO }}:laravel-base.${{ env.TAG_ADDITION }}
          tags: |
            ${{ env.IMAGE_REPO }}:laravel-app.${{ env.TAG_ADDITION }}
          push: true
          pull: false # Don't pull base image from Docker Hub (we just built it locally)
          load: true
          cache-from: |
            type=registry,ref=${{ env.IMAGE_REPO }}:laravel-app.${{ env.TAG_ADDITION }}.cache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:laravel-app.${{ env.TAG_ADDITION }}.cache,mode=max

      - name: Save images
        run: |
          mkdir -p docker-images
          docker save ${{ env.IMAGE_REPO }}:laravel-app.${{ env.TAG_ADDITION }} -o docker-images/laravel-app.tar

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: image-app
          path: docker-images/*.tar
          retention-days: 1
          compression-level: 0

  build-compose-images:
    name: Build docker images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: nginx
            context: website/docker/img_nginx
            file: website/docker/img_nginx/Dockerfile.nginx
            tag: website-nginx
          - name: redis
            context: website/docker/img_redis
            file: website/docker/img_redis/Dockerfile.redis
            tag: website-redis
          - name: mysql-db
            context: website/docker/img_mysqldb
            file: website/docker/img_mysqldb/Dockerfile.mysql
            tag: mysql-db
          - name: cert-local
            context: website/docker/img_certlocal
            file: website/docker/img_certlocal/Dockerfile.cert-local
            tag: cert-local
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build ${{ matrix.image.tag }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ matrix.image.tag }}.${{ env.TAG_ADDITION }}
          push: true
          load: true
          cache-from: |
            type=registry,ref=${{ env.IMAGE_REPO }}:${{ matrix.image.tag }}.${{ env.TAG_ADDITION }}.cache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:${{ matrix.image.tag }}.cache,mode=max

      - name: Save ${{ matrix.image.tag }}.${{ env.TAG_ADDITION }} image
        run: |
          mkdir -p docker-images
          filename=$(echo "${{ matrix.image.name }}" | tr '/:' '_' | sed 's/__*/_/g' | sed 's/^_\|_$//g')
          docker save ${{ env.IMAGE_REPO }}:${{ matrix.image.tag }}.${{ env.TAG_ADDITION }} -o docker-images/${filename}.tar

      - name: Upload ${{ matrix.image.tag }}.${{ env.TAG_ADDITION }} image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.image.name }}
          path: docker-images/*.tar
          retention-days: 1

  test:
    name: Run Laravel tests
    runs-on: ubuntu-latest
    needs: [build-laravel-image, build-compose-images]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker Compose images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: docker-images

      - name: Load Docker Compose images
        run: |
          for image in docker-images/*.tar; do
            docker load -i "$image" || true
          done

      - name: Start Docker services
        working-directory: website
        run: |
          IMAGE_REPO="${{ env.IMAGE_REPO }}" \
          TAG_ADDITION="${{ env.TAG_ADDITION }}" \
          docker compose -f docker/docker-compose.yml --env-file docker/.env.testing --profile testing up -d --no-build

      - name: Run Laravel tests on main db in parallel
        run: |
          docker exec -u www-data laravel_app sh -c '. /usr/local/bin/test_parallel.sh'

      - name: Cleanup
        if: always()
        working-directory: website
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/.env.testing --profile testing down -v

