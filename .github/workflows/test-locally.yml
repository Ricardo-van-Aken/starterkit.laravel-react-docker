name: Run tests locally

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_REPO: ${{ vars.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}
  TAG_ADDITION: test
  RUN_ID: ${{ github.run_id }}

jobs:
  build-laravel-image:
    name: Build app image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Laravel base image
        uses: docker/build-push-action@v5
        with:
          context: website
          file: website/docker/img_laravel/Dockerfile.laravel-base
          tags: |
            ${{ env.IMAGE_REPO }}:laravel-base.${{ env.RUN_ID }}
          push: true
          load: true
          cache-from: |
            type=registry,ref=${{ env.IMAGE_REPO }}:laravel-base.${{ env.TAG_ADDITION }}.cache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:laravel-base.${{ env.TAG_ADDITION }}.cache,mode=max

      - name: Verify Laravel base image is available locally
        run: |
          if docker images --format "{{.Repository}}:{{.Tag}}" | grep -q "^${{ env.IMAGE_REPO }}:laravel-base.${{ env.RUN_ID }}$"; then
            echo "Laravel base image is available locally"
            docker images | grep "laravel-base.${{ env.RUN_ID }}"
          else
            echo "Laravel base image is NOT available locally"
            exit 1
          fi

      - name: Build Laravel app image
        uses: docker/build-push-action@v5
        with:
          context: website
          file: website/docker/img_laravel/Dockerfile.laravel-volume
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_REPO }}:laravel-base.${{ env.RUN_ID }}
          tags: |
            ${{ env.IMAGE_REPO }}:laravel-app.${{ env.RUN_ID }}
          push: true
          pull: false # Don't pull base image from Docker Hub (we just built it locally)
          load: false
          cache-from: |
            type=registry,ref=${{ env.IMAGE_REPO }}:laravel-app.${{ env.TAG_ADDITION }}.cache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:laravel-app.${{ env.TAG_ADDITION }}.cache,mode=max

  build-compose-images:
    name: Build docker images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: nginx
            context: website/docker/img_nginx
            file: website/docker/img_nginx/Dockerfile.nginx
            tag: website-nginx
          - name: redis
            context: website/docker/img_redis
            file: website/docker/img_redis/Dockerfile.redis
            tag: website-redis
          - name: mysql-db
            context: website/docker/img_mysqldb
            file: website/docker/img_mysqldb/Dockerfile.mysql
            tag: mysql-db
          - name: cert-local
            context: website/docker/img_certlocal
            file: website/docker/img_certlocal/Dockerfile.cert-local
            tag: cert-local
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build ${{ matrix.image.tag }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ matrix.image.tag }}.${{ env.RUN_ID }}
          push: true
          load: false
          cache-from: |
            type=registry,ref=${{ env.IMAGE_REPO }}:${{ matrix.image.tag }}.${{ env.TAG_ADDITION }}.cache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:${{ matrix.image.tag }}.${{ env.TAG_ADDITION }}.cache,mode=max

  test:
    name: Run Laravel tests
    runs-on: ubuntu-latest
    needs: [build-laravel-image, build-compose-images]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Pull Docker Compose images needed to mock production
        working-directory: website
        run: |
          IMAGE_REPO="${{ env.IMAGE_REPO }}" \
          TAG_ADDITION="${{ env.RUN_ID }}" \
          docker compose -f docker/docker-compose.yml --env-file docker/.env.mock-prod --profile mock-prod pull

      - name: Start Docker services to mock production
        working-directory: website
        run: |
          IMAGE_REPO="${{ env.IMAGE_REPO }}" \
          TAG_ADDITION="${{ env.RUN_ID }}" \
          docker compose -f docker/docker-compose.yml --env-file docker/.env.mock-prod --profile mock-prod up -d --no-build

      - name: Run Laravel tests on mock production in parallel
        run: |
          docker exec -u www-data laravel_app sh -c 'bash /usr/local/bin/test.sh --parallel'

      - name: Cleanup
        if: always()
        working-directory: website
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/.env.mock-prod --profile mock-prod down -v

  static-analysis:
    name: Run static analysis
    runs-on: ubuntu-latest
    needs: [build-laravel-image]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Pull Laravel app image
        run: |
          docker pull ${{ env.IMAGE_REPO }}:laravel-app.${{ env.RUN_ID }}

      - name: Run PHPStan
        run: |
          docker run --rm \
            ${{ env.IMAGE_REPO }}:laravel-app.${{ env.RUN_ID }} \
            composer analyse
 
      - name: Run Architecture Tests
        run: |
          docker run --rm \
            ${{ env.IMAGE_REPO }}:laravel-app.${{ env.RUN_ID }} \
            composer test:arch

  

  cleanup-dockerhub:
    name: Cleanup temporary Docker Hub images
    runs-on: ubuntu-latest
    needs:
      - test
      - static-analysis
    if: always()

    steps:
      - name: Delete temporary Docker Hub tags
        env:
          DOCKERHUB_USER: ${{ vars.DOCKER_HUB_USERNAME }}
          IMAGE_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Fetching Docker Hub JWT…"
          TOKEN=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKERHUB_USER}\", \"password\": \"${DOCKERHUB_TOKEN}\"}" \
            | jq -r .token)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to authenticate to Docker Hub"
            exit 1
          fi

          echo "Listing tags for ${DOCKERHUB_USER}/${IMAGE_NAME}…"
          TAGS=$(curl -s \
            -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USER}/${IMAGE_NAME}/tags/?page_size=1000" \
            | jq -r ".results[].name | select(endswith(\".${RUN_ID}\"))")

          if [ -z "$TAGS" ]; then
            echo "No temporary tags found"
            exit 0
          fi

          EXIT_CODE=0
          for tag in $TAGS; do
            echo "Deleting ${IMAGE_NAME}:$tag"
            if ! curl -sf -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USER}/${IMAGE_NAME}/tags/$tag/"; then
              echo "Failed to delete ${IMAGE_NAME}:$tag"
              EXIT_CODE=1
            fi
          done

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Cleanup completed with errors"
            exit 1
          fi

          echo "Cleanup completed"
