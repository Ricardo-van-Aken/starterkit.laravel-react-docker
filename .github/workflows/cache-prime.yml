name: Prime Branch Cache

on:
  create:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to prime (defaults to current)'
        required: false
        type: string

jobs:
  prime:
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch'
    name: Prime branch cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history for parent detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Branch Name
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "create" ]; then
            BRANCH_NAME="${{ github.event.ref }}"
          else
            BRANCH_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          fi
          echo "raw_branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Generate Docker Tags for Current Branch
        id: vars
        uses: ./.github/actions/docker-tag
        with:
          branch_name: ${{ steps.branch.outputs.raw_branch }}
          docker_username: ${{ vars.DOCKER_HUB_USERNAME }}

      - name: Detect Closest Relative Branch
        id: relative
        uses: ./.github/actions/get-closest-relative
        with:
          current_branch: ${{ steps.branch.outputs.raw_branch }}
          include_branches: remote

      - name: Generate Docker Tags for Relative Branch
        id: relative_vars
        uses: ./.github/actions/docker-tag
        with:
          branch_name: ${{ steps.relative.outputs.short_name }}
          docker_username: ${{ vars.DOCKER_HUB_USERNAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Prime Build
        uses: docker/build-push-action@v5
        with:
          context: website
          file: website/docker/img_laravel/Dockerfile.laravel
          target: volume-prod
          push: false
          cache-from: |
            type=registry,ref=${{ steps.vars.outputs.image_repo }}:laravel-app.${{ steps.relative_vars.outputs.safe_tag }}.cache
            type=registry,ref=${{ steps.vars.outputs.image_repo }}:laravel-app.main.cache
          cache-to: type=registry,ref=${{ steps.vars.outputs.image_repo }}:laravel-app.${{ steps.vars.outputs.safe_tag }}.cache,mode=max
