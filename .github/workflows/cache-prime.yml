name: Prime Branch Cache

on:
  create:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to prime (defaults to current)'
        required: false
        type: string

jobs:
  prime:
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch'
    name: Prime branch cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: laravel-app
            context: website
            file: website/docker/img_laravel/Dockerfile.laravel
            target: volume-dev
            tag: laravel-app
          - name: laravel-scheduler
            context: website
            file: website/docker/img_laravel/Dockerfile.laravel
            target: scheduler
            tag: laravel-scheduler
            build-args: SCHEDULER_BASE=volume-dev
          - name: nginx
            context: website/docker/img_nginx
            file: website/docker/img_nginx/Dockerfile.nginx
            tag: website-nginx
          - name: redis
            context: website/docker/img_redis
            file: website/docker/img_redis/Dockerfile.redis
            tag: website-redis
          - name: mysql-db
            context: website/docker/img_mysqldb
            file: website/docker/img_mysqldb/Dockerfile.mysql
            tag: mysql-db
          - name: cert-local
            context: website/docker/img_certlocal
            file: website/docker/img_certlocal/Dockerfile.cert-local
            tag: cert-local

    steps:
      - name: Checkout code (full history for parent detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Branch Name
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "create" ]; then
            BRANCH_NAME="${{ github.event.ref }}"
          else
            BRANCH_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          fi
          echo "raw_branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Generate Docker Tags for Current Branch
        id: vars
        uses: ./.github/actions/docker-tag
        with:
          branch_name: ${{ steps.branch.outputs.raw_branch }}
          docker_username: ${{ vars.DOCKER_HUB_USERNAME }}

      - name: Detect Closest Relative Branch
        id: relative
        uses: ./.github/actions/get-closest-relative
        with:
          current_branch: ${{ steps.branch.outputs.raw_branch }}
          include_branches: remote

      - name: Generate Docker Tags for Relative Branch
        id: relative_vars
        uses: ./.github/actions/docker-tag
        with:
          branch_name: ${{ steps.relative.outputs.short_name }}
          docker_username: ${{ vars.DOCKER_HUB_USERNAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Prime Build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          build-args: ${{ matrix.image.build-args }}
          push: false
          cache-from: |
            type=registry,ref=${{ steps.vars.outputs.image_repo }}:${{ matrix.image.tag }}.${{ steps.relative_vars.outputs.safe_tag }}.cache
            type=registry,ref=${{ steps.vars.outputs.image_repo }}:${{ matrix.image.tag }}.main.cache
          cache-to: type=registry,ref=${{ steps.vars.outputs.image_repo }}:${{ matrix.image.tag }}.${{ steps.vars.outputs.safe_tag }}.cache,mode=max
