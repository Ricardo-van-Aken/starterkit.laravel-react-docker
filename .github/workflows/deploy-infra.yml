name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  # DigitalOcean Spaces bucket name and access key, used for terraform remote state.
  TF_VAR_region: ${{ vars.DO_STATE_BUCKET_REGION }}
  TF_VAR_bucket_name: ${{ vars.DO_STATE_BUCKET_NAME }}
  AWS_ACCESS_KEY_ID: ${{ vars.DO_STATE_BUCKET_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_STATE_BUCKET_SECRET_KEY }}

  # Terraforms DigitalOcean provider authorization.
  TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
  TF_VAR_spaces_access_id: ${{ secrets.DO_SPACES_ACCESS_ID }}
  TF_VAR_spaces_secret_key: ${{ secrets.DO_SPACES_SECRET_KEY }}
  TF_VAR_ssh_key_name: ${{ secrets.SSH_KEY_NAME }}

  DOCKER_USER: "${{ secrets.DOCKER_USER }}"
  WORKSPACE: ${{ github.workspace }}

jobs:
  generate-backend-config:
    name: Generate Backend Configuration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backend.hcl file
        run: |
          source ../scripts/common.sh
          generate_backend_file "${{ vars.DO_STATE_BUCKET_REGION }}" "${{ vars.DO_STATE_BUCKET_NAME }}" "backend.hcl"

      - name: Upload backend.hcl file
        uses: actions/upload-artifact@v4
        with:
          name: backend.hcl
          path: deployment/terraform/backend.hcl

  terraform-ephemeral-create:
    name: Terraform Temporary resources
    runs-on: ubuntu-latest
    needs: generate-backend-config
    defaults:
      run:
        working-directory: deployment/terraform/ephemeral
    outputs:
      spaces_access_id: ${{ steps.ephemeral-outputs.outputs.spaces_access_id }}
      spaces_secret_key: ${{ steps.ephemeral-outputs.outputs.spaces_secret_key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download backend.hcl file
        uses: actions/download-artifact@v4
        with:
          name: backend.hcl
          path: deployment/terraform/ephemeral

      - name: Initialize Terraform workspaces
        run: |
          terraform -chdir=spaces-key init -backend-config="../backend.hcl" -backend-config="workspace_key_prefix=projects/${{ github.event.repository.name }}/infra-ephemeral"

      - name: Select or create workspaces
        run: |
          terraform -chdir=spaces-key workspace select -or-create spaces-key

      - name: Apply
        run: |
          terraform -chdir=spaces-key apply -auto-approve

      - name: Capture Outputs
        id: ephemeral-outputs
        run: |
          echo "spaces_access_id=$(terraform -chdir=spaces-key output -raw spaces_access_id)" >> $GITHUB_OUTPUT
          echo "spaces_secret_key=$(terraform -chdir=spaces-key output -raw spaces_secret_key)" >> $GITHUB_OUTPUT

  terraform-ephemeral-destroy:
    name: Destroy temporary Terraform resources
    runs-on: ubuntu-latest
    needs: terraform-ephemeral-create
    defaults:
      run:
        working-directory: deployment/terraform/ephemeral

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download backend.hcl file
        uses: actions/download-artifact@v4
        with:
          name: backend.hcl
          path: deployment/terraform/ephemeral

      - name: Initialize Terraform workspaces
        run: |
          terraform -chdir=spaces-key init -backend-config="../backend.hcl" -backend-config="workspace_key_prefix=projects/${{ github.event.repository.name }}/infra-ephemeral"

      - name: Select workspace and destroy
        run: |
          terraform -chdir=spaces-key workspace select spaces-key
          terraform -chdir=spaces-key apply -destroy -auto-approve