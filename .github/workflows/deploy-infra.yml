name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  # DigitalOcean Spaces bucket name and access key, used for terraform remote state.
  TF_VAR_region: ${{ vars.DO_STATE_BUCKET_REGION }}
  TF_VAR_bucket_name: ${{ vars.DO_STATE_BUCKET_NAME }}
  AWS_ACCESS_KEY_ID: ${{ vars.DO_STATE_BUCKET_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_STATE_BUCKET_SECRET_KEY }}

  # Terraforms DigitalOcean provider authorization.
  TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
  TF_VAR_spaces_access_id: ${{ secrets.DO_SPACES_ACCESS_ID }}
  TF_VAR_spaces_secret_key: ${{ secrets.DO_SPACES_SECRET_KEY }}
  TF_VAR_ssh_key_name: ${{ secrets.SSH_KEY_NAME }}

  DOCKER_USER: "${{ secrets.DOCKER_USER }}"
  WORKSPACE: ${{ github.workspace }}

jobs:
  generate-backend-config:
    name: Generate Backend Configuration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backend.hcl file
        run: |
          source ../scripts/common.sh
          generate_backend_file "${{ vars.DO_STATE_BUCKET_REGION }}" "${{ vars.DO_STATE_BUCKET_NAME }}" "backend.hcl"

      - name: Upload backend.hcl file
        uses: actions/upload-artifact@v4
        with:
          name: backend.hcl
          path: deployment/terraform/backend.hcl

  terraform-ephemeral-create:
    name: Terraform Temporary resources
    runs-on: ubuntu-latest
    needs: generate-backend-config
    defaults:
      run:
        working-directory: deployment/terraform/ephemeral
    outputs:
      spaces_access_id: ${{ steps.ephemeral-outputs.outputs.spaces_access_id }}
      spaces_secret_key: ${{ steps.ephemeral-outputs.outputs.spaces_secret_key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download backend.hcl file
        uses: actions/download-artifact@v4
        with:
          name: backend.hcl
          path: deployment/terraform/ephemeral

      - name: Initialize Terraform workspaces
        run: |
          terraform -chdir=spaces-key init -backend-config="../backend.hcl" -backend-config="workspace_key_prefix=projects/${{ github.event.repository.name }}/infra-ephemeral"

      - name: Select or create workspaces
        run: |
          terraform -chdir=spaces-key workspace select -or-create spaces-key

      - name: Apply
        run: |
          terraform -chdir=spaces-key apply -auto-approve

      - name: Capture Outputs
        id: ephemeral-outputs
        run: |
          echo "spaces_access_id=$(terraform -chdir=spaces-key output -raw spaces_access_id)" >> $GITHUB_OUTPUT
          echo "spaces_secret_key=$(terraform -chdir=spaces-key output -raw spaces_secret_key)" >> $GITHUB_OUTPUT

      - name: Echo outputs
        run: |
          echo "spaces_access_id=$(terraform -chdir=spaces-key output -raw spaces_access_id)"
          echo "spaces_secret_key=$(terraform -chdir=spaces-key output -raw spaces_secret_key)"

  terraform-bootstrap-create:
    name: Terraform Bootstrap (${{ github.event.inputs.environment }} - ${{ github.event.inputs.action }})
    runs-on: ubuntu-latest
    needs: generate-backend-config
    defaults:
      run:
        working-directory: deployment/terraform/bootstrap
    outputs:
      project_id: ${{ steps.bootstrap-outputs.outputs.project_id }}
      domain_id: ${{ steps.bootstrap-outputs.outputs.domain_id }}
    if: github.event.inputs.action == 'apply'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download backend.hcl file
        uses: actions/download-artifact@v4
        with:
          name: backend.hcl
          path: deployment/terraform/bootstrap

      - name: Initialize Terraform workspaces
        run: |
          terraform init -backend-config="backend.hcl" -backend-config="key=projects/${{ github.event.repository.name }}/infra-bootstrap/terraform.tfstate"
      
      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        run: terraform apply tfplan

      - name: Capture Outputs
        id: bootstrap-outputs
        run: |
          echo "project_id=$(terraform output -raw project_id)" >> $GITHUB_OUTPUT
          echo "domain_id=$(terraform output -raw domain_id)" >> $GITHUB_OUTPUT

  terraform-plan:
    name: Terraform Plan (${{ github.event.inputs.environment }} - ${{ github.event.inputs.action }})
    runs-on: ubuntu-latest
    needs: [terraform-ephemeral-create, terraform-bootstrap-create]
    env:
      TF_VAR_spaces_access_id: ${{ needs.terraform-ephemeral-create.outputs.spaces_access_id }}
      TF_VAR_spaces_secret_key: ${{ needs.terraform-ephemeral-create.outputs.spaces_secret_key }}
      TF_VAR_project_id: ${{ needs.terraform-bootstrap-create.outputs.project_id }}
      TF_VAR_domain_id: ${{ needs.terraform-bootstrap-create.outputs.domain_id }}
    defaults:
      run:
        working-directory: deployment/terraform/environments/common
    outputs:
      has_changes: ${{ steps.plan-apply.outputs.exitcode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Echo outputs
        run: |
          echo "spaces_access_id=${{ needs.terraform-ephemeral-create.outputs.spaces_access_id }}"
          echo "spaces_secret_key=${{ needs.terraform-ephemeral-create.outputs.spaces_secret_key }}"

      - name: Download backend.hcl file
        uses: actions/download-artifact@v4
        with:
          name: backend.hcl
          path: deployment/terraform/

      - name: Select/Create Workspace
        run: |
          terraform init -backend-config="../../backend.hcl" -backend-config="workspace_key_prefix=projects/${{ github.event.repository.name }}/infra-environments"
          terraform workspace select -or-create ${{ github.event.inputs.environment }}

      - name: Plan (apply/destroy flag selection)
        id: plan-flag
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            echo "DESTROY_FLAG=-destroy" >> $GITHUB_OUTPUT
          else
            echo "DESTROY_FLAG=" >> $GITHUB_OUTPUT
          fi

      - name: Plan (apply/destroy)
        id: plan-apply
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan ${{ steps.plan-flag.outputs.DESTROY_FLAG }} \
          -var-file="../${{ github.event.inputs.environment }}/terraform.tfvars" \
          -out=tfplan \
          -detailed-exitcode -no-color 2>&1 | tee plan.log || true
          

          # Extract lock id (awk method - robust)
          LOCK_ID=$(awk '/Lock Info:/{f=1; next} f && /ID:/{print $2; exit}' plan.log)

          if [ -n "$LOCK_ID" ]; then
            echo "Found lock id: $LOCK_ID"
            # Export to later steps via GITHUB_OUTPUT
            echo "lock_id=$LOCK_ID" >> $GITHUB_OUTPUT
          else
            echo "No lock id found in plan output."
          fi

      - name: Force-unlock terraform state if lock found
        if: ${{ steps.plan-apply.outputs.lock_id != '' }}
        env:
          LOCK_ID: ${{ steps.plan-apply.outputs.lock_id }}
        run: |
          echo "Unlocking state with lock id: $LOCK_ID"
          # Ensure backend is initialized (again) if necessary
          terraform init -input=false -no-color
          terraform force-unlock -force "$LOCK_ID"
      # - name: Force unlock
      #   run: |


      - name: Upload Plan Artifacts
        if: github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.environment }}
          path: deployment/terraform/environments/common/tfplan

  terraform-apply:
    name: Apply Main (if changes are detected and after manual approval)
    if: (github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy') && needs.terraform-plan.outputs.has_changes != 1
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: deployment/terraform/environments/common
    outputs:
      droplet_ipv4: ${{ steps.terraform-state.outputs.droplet_ipv4 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download backend.hcl file
        uses: actions/download-artifact@v4
        with:
          name: backend.hcl
          path: deployment/terraform/

      - name: Download Plan Artifacts
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.environment }}
          path: deployment/terraform/environments/common

      - name: Select Workspace
        run: |
          terraform init -backend-config="../../backend.hcl" -backend-config="workspace_key_prefix=projects/${{ github.event.repository.name }}/infra-environments"
          terraform workspace select -or-create ${{ github.event.inputs.environment }}

      - name: Apply (from approved plan)
        run: |
          terraform apply tfplan

      - id: terraform-state
        name: Capture Outputs
        if: github.event.inputs.action == 'apply'
        run: |
          echo "$(terraform output -raw droplet_ipv4)"
          echo "droplet_ipv4=$(terraform output -raw droplet_ipv4)" >> $GITHUB_OUTPUT

  terraform-bootstrap-destroy:
    name: Terraform Bootstrap (${{ github.event.inputs.environment }} - ${{ github.event.inputs.action }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment/terraform/bootstrap
    if: github.event.inputs.action == 'destroy'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download backend.hcl file
        uses: actions/download-artifact@v4
        with:
          name: backend.hcl
          path: deployment/terraform/bootstrap

      - name: Initialize Terraform workspaces
        run: |
          terraform init -backend-config="backend.hcl" -backend-config="workspace_key_prefix=projects/${{ github.event.repository.name }}/infra-bootstrap"

      - name: Plan
        run: terraform plan -destroy -out=tfplan

      - name: Apply
        run: terraform apply tfplan

  terraform-ephemeral-destroy:
    name: Destroy temporary Terraform resources
    runs-on: ubuntu-latest
    needs: [terraform-ephemeral-create, terraform-plan, terraform-apply]
    defaults:
      run:
        working-directory: deployment/terraform/ephemeral
    if: ${{ always() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download backend.hcl file
        uses: actions/download-artifact@v4
        with:
          name: backend.hcl
          path: deployment/terraform/ephemeral

      - name: Initialize Terraform workspaces
        run: |
          terraform -chdir=spaces-key init -backend-config="../backend.hcl" -backend-config="workspace_key_prefix=projects/${{ github.event.repository.name }}/infra-ephemeral"

      - name: Select workspace and destroy
        run: |
          terraform -chdir=spaces-key workspace select spaces-key
          terraform -chdir=spaces-key apply -destroy -auto-approve