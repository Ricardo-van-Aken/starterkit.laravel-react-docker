name: Purge Branch Cache

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to purge (defaults to current)'
        required: false
        type: string

jobs:
  purge:
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch'
    name: Purge branch cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Branch Name
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "delete" ]; then
            BRANCH_NAME="${{ github.event.ref }}"
          else
            BRANCH_NAME="${{ github.event.inputs.branch || github.ref_name }}"
          fi
          echo "raw_branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Generate Docker Tags
        id: vars
        uses: ./.github/actions/docker-tag
        with:
          branch_name: ${{ steps.branch.outputs.raw_branch }}
          docker_username: ${{ vars.DOCKER_HUB_USERNAME }}

      - name: Delete branch tags on Docker Hub
        env:
          DOCKERHUB_REPO: ${{ steps.vars.outputs.image_repo }}
          SAFE_TAG: ${{ steps.vars.outputs.safe_tag }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DOCKERHUB_USER: ${{ vars.DOCKER_HUB_USERNAME }}
        run: |
          set -euo pipefail

          echo "Fetching Docker Hub JWT…"
          TOKEN=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKERHUB_USER}\", \"password\": \"${DOCKERHUB_TOKEN}\"}" \
            | jq -r .token)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to authenticate to Docker Hub"
            exit 1
          fi

          echo "Listing tags associated with sanitized branch ${SAFE_TAG}…"
          TAGS=$(curl -s \
            -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/tags/?page_size=1000" \
            | jq -r ".results[].name | select(split(\".\") | any(. == \"${SAFE_TAG}\"))")

          if [ -z "$TAGS" ]; then
            echo "No tags found for sanitized branch ${SAFE_TAG}"
            exit 0
          fi

          EXIT_CODE=0
          for tag in $TAGS; do
            echo "Deleting ${DOCKERHUB_REPO}:$tag"
            if ! curl -sf -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/tags/$tag/"; then
              echo "Failed to delete ${DOCKERHUB_REPO}:$tag"
              EXIT_CODE=1
            fi
          done

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Purge completed with errors"
            exit 1
          fi

          echo "Purge completed successfully"
