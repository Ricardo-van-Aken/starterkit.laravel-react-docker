services:
  # Laravel Application
  app:
    image: ${IMAGE_REPO}:laravel-app.${TAG_ADDITION}
    build:
      context: ../
      dockerfile: docker/img_laravel/${DOCKERFILE}
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - ${ENV_FILE}:/var/www/.env     # Bind mount: Application environment variables
      - ${APP_FILES_DIR}:/var/www     # Volume or Bind mount: Application files to be served by nginx
      - mysql-certs:/mysql-certs:ro
    secrets:
      - mysql_app_db_database
      - mysql_app_db_username
      - mysql_app_db_password
      - mysql_app_db_ssl
      - mysql_app_db_host
      - mysql_app_db_port
      - mysql_testing_db_database
      - mysql_testing_db_username
      - mysql_testing_db_password
      - redis_password
    depends_on:
      redis:
        condition: service_started
      mysql_db:
        condition: service_healthy
        required: false
    command: ["/bin/sh", "-c", ". /usr/local/bin/read-db-credentials.sh; . /usr/local/bin/read-db-credentials-testing.sh; . /usr/local/bin/read-redis-password.sh; exec php-fpm"]
    profiles: ["all", "local-bindmount", "local-volume", "mock-prod", "staging", "production"]

  # Nginx Web Server
  nginx:
    image: ${IMAGE_REPO}:website-nginx.${TAG_ADDITION}
    build:
      context: ./img_nginx
      dockerfile: Dockerfile.nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP
      - "443:443"   # HTTPS
    volumes:
      - ${APP_FILES_DIR}:/var/www           # Volume or Bind mount: Application files to be served by nginx
      - certbot_files:/var/www/certbot/:ro  # Volume: Certbot files to be served by nginx (for confirming domain ownership)
      - certbot_certs:/etc/letsencrypt/:ro    # Volume: Https certificates from certs container
    depends_on:
      app:
        condition: service_started
        required: false
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
    profiles: ["all", "local-bindmount", "local-volume", "mock-prod", "staging", "production"]

  # Redis for sessions and caching
  redis:
    image: ${IMAGE_REPO}:website-redis.${TAG_ADDITION}
    build:
      context: ./img_redis
      dockerfile: Dockerfile.redis
    container_name: redis
    restart: unless-stopped
    secrets:
      - redis_password
    environment:
      REDIS_PASS_FILE: /run/secrets/redis_password
    profiles: ["all", "local-bindmount", "local-volume", "mock-prod", "staging", "production"]

  # Certbot for generating real SSL certificates
  certbot:
    image: ${IMAGE_REPO}:website-certbot.${TAG_ADDITION}
    container_name: certbot
    build:
      context: ./img_certbot
      dockerfile: Dockerfile.certbot
    depends_on:
      - nginx
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - DOMAIN_EMAIL=${DOMAIN_EMAIL}
    restart: no
    volumes:
      - certbot_files:/var/www/certbot/:rw # Volume: Certbot files to be served by nginx (for confirming domain ownership)
      - certbot_certs:/etc/letsencrypt/:rw # Volume: Https certificates from Certbot
    profiles: ["all", "staging", "production"]

  # MySQL Database
  mysql_db:
    image: ${IMAGE_REPO}:mysql-db.${TAG_ADDITION}
    build:
      context: ./img_mysqldb
      dockerfile: Dockerfile.mysql
    container_name: mysql_db
    restart: unless-stopped
    secrets:
      - mysql_db_rootpass
      - mysql_app_db_database
      - mysql_app_db_username
      - mysql_app_db_password
      - mysql_app_db_ssl
      - mysql_testing_db_database
      - mysql_testing_db_username
      - mysql_testing_db_password
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-certs:/mysql-certs
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --password=$$MYSQL_PASSWORD
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 55
    command: ["/bin/sh", "-c", ". /custom-entrypoint.sh"]
    profiles: ["all", "local-bindmount", "local-volume", "mock-prod"]
  
  # Local Certificate Generation Service
  cert_local:
    image: ${IMAGE_REPO}:cert-local.${TAG_ADDITION}
    build:
      context: ./img_certlocal
      dockerfile: Dockerfile.cert-local
    container_name: cert_local
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
    volumes:
      - certbot_certs:/etc/letsencrypt/:rw  # Bind-mount: Share the generated SSL certificates with nginx
    profiles: ["all", "local-bindmount", "local-volume", "mock-prod"]

  # PHPMyAdmin for inspecting the database, logged in as the admin user used by Laravel
  phpmyadmin-admin:
    # Docker Official Image: phpmyadmin:latest. Jan 17, 2026 at 4:41 am
    image: phpmyadmin@sha256:43af279a6670e205650d33361b2ff1ad75a6796852b4937af12f8324a381ed97
    container_name: phpmyadmin-admin
    restart: unless-stopped
    volumes:
      - mysql-certs:/mysql-certs:ro
    environment:
      PMA_HOST: mysql_db  # Must be the same as container_name of the db
      PMA_USER_FILE: /run/secrets/mysql_app_db_username
      PMA_PASSWORD_FILE: /run/secrets/mysql_app_db_password
      PMA_SSL: 1
      PMA_SSL_CA: /mysql-certs/ca.pem
    ports:
      - 8080:80
    depends_on:
      - mysql_db
    secrets:
      - mysql_app_db_username
      - mysql_app_db_password
    profiles: ["all", "local-bindmount", "local-volume"]
  # PHPMyAdmin for inspecting the database, logged in as the admin-testing user used by Laravel for testing
  phpmyadmin-testing:
    # Docker Official Image: phpmyadmin:fpm-alpine. Jan 17, 2026 at 4:41 am
    image: phpmyadmin@sha256:43af279a6670e205650d33361b2ff1ad75a6796852b4937af12f8324a381ed97
    container_name: phpmyadmin-testing
    restart: unless-stopped
    volumes:
      - mysql-certs:/mysql-certs:ro
    environment:
      PMA_HOST: mysql_db  # Must be the same as container_name of the db
      PMA_USER_FILE: /run/secrets/mysql_testing_db_username
      PMA_PASSWORD_FILE: /run/secrets/mysql_testing_db_password
      PMA_SSL: 1
      PMA_SSL_CA: /mysql-certs/ca.pem
    ports:
      - 8081:80
    depends_on:
      - mysql_db
    secrets:
      - mysql_testing_db_username
      - mysql_testing_db_password
    profiles: ["all", "local-bindmount", "local-volume"]

  # phpRedisAdmin for inspecting Redis data, similar to PHPMyAdmin
  phpredisadmin:
    # erikdubbelboer/phpredisadmin:latest. Dec 22, 2025 at 3:58 pm
    image: erikdubbelboer/phpredisadmin@sha256:335e832bc713210011a326088f3e5eeefe8794799dbbfa32d2e04cbc180bdb44
    container_name: phpredisadmin
    restart: unless-stopped
    environment:
      REDIS_1_HOST: redis
      REDIS_1_PORT: 6379
      REDIS_1_AUTH: redis_password
      REDIS_1_NAME: "Redis Cache"
    ports:
      - 8082:80
    depends_on:
      - redis
    profiles: ["all", "local-bindmount", "local-volume"]

volumes:
  app_files:
  certbot_files:
  certbot_certs:
  mysql-data:
  mysql-certs:

secrets:
  mysql_testing_db_password:
    file: ./secrets/mysql_testing_db_password
  mysql_testing_db_username:
    file: ./secrets/mysql_testing_db_username
  mysql_testing_db_database:
    file: ./secrets/mysql_testing_db_database
  mysql_app_db_password:
    file: ./secrets/mysql_app_db_password
  mysql_app_db_username:
    file: ./secrets/mysql_app_db_username
  mysql_app_db_database:
    file: ./secrets/mysql_app_db_database
  mysql_app_db_ssl:
    file: ./secrets/mysql_app_db_ssl
  mysql_app_db_port:
    file: ./secrets/mysql_app_db_port
  mysql_app_db_host:
    file: ./secrets/mysql_app_db_host
  mysql_db_rootpass:
    file: ./secrets/mysql_db_rootpass
  redis_password:
    file: ./secrets/redis_password